services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdetech
      POSTGRES_PASSWORD: gdetech
      POSTGRES_DB: gdetech
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gdetech_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdetech -d gdetech"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_YANDEX_AUTH_ENABLED: ${NEXT_PUBLIC_YANDEX_AUTH_ENABLED:-false}
        NEXT_PUBLIC_VK_AUTH_ENABLED: ${NEXT_PUBLIC_VK_AUTH_ENABLED:-false}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://gdetech:gdetech@db:5432/gdetech
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-gdetech_auth}
      AUTH_CODE_TTL_MINUTES: ${AUTH_CODE_TTL_MINUTES:-10}
      AUTH_MAX_CODE_ATTEMPTS: ${AUTH_MAX_CODE_ATTEMPTS:-5}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.yandex.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@gdetech.ru}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-GdeTech}
      YANDEX_AUTH_ENABLED: ${YANDEX_AUTH_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:3001/api/auth/yandex/callback}
      YANDEX_SUCCESS_URL: ${YANDEX_SUCCESS_URL:-/}
      YANDEX_ERROR_URL: ${YANDEX_ERROR_URL:-/?auth_error=yandex}
      VK_AUTH_ENABLED: ${VK_AUTH_ENABLED:-false}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-http://localhost:3001/api/auth/vk/callback}
      VK_SUCCESS_URL: ${VK_SUCCESS_URL:-/}
      VK_ERROR_URL: ${VK_ERROR_URL:-/?auth_error=vk}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-andrey.shelemetev@gmail.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  gdetech_db_data:
